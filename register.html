<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | LibraDesk</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="layout.css">
  <script src="theme.js" defer></script><script src="validation.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">L</span> LibraDesk</a><button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="main-nav"><a href="index.html">Overview</a><a href="home.html">Dashboard</a><a href="signin.html">Sign in</a><button class="theme-toggle" type="button">🌙</button></nav></header>
  <main class="container form-page">
    <div class="form-intro"><span class="eyebrow">NEW LIBRARY MEMBER</span><h1>Create your member profile</h1><p>Enter the details below. Each field is checked when you leave it and again when you submit.</p></div>
    <form id="registerForm" class="form-card" novalidate>
      <div class="form-grid">
        <label>Full Name<input id="fullName" name="fullName" type="text" autocomplete="name" placeholder="e.g. Arun Kumar" required><span class="error-msg"></span></label>
        <label>Employee / Register ID<input id="empId" name="empId" type="text" placeholder="6–12 letters or numbers" required><span class="error-msg"></span></label>
        <label>Email Address<input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><span class="error-msg"></span></label>
        <label>Mobile Number<input id="mobile" name="mobile" type="tel" inputmode="numeric" placeholder="10-digit mobile number" required><span class="error-msg"></span></label>
        <label>Division
          <select id="dept" name="dept" required><option value="">Select division</option><option value="CSE">Computer Science & Engineering</option><option value="IT">Information Technology</option><option value="ECE">Electronics & Communication</option><option value="MECH">Mechanical Engineering</option><option value="OTHER">Other</option></select><span class="error-msg"></span>
        </label>
        <label>Password<input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required><span class="error-msg"></span></label>
        <label class="full-width">Confirm Password<input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter password again" required><span class="error-msg"></span></label>
      </div>
      <button id="registerSubmit" class="btn btn-primary btn-wide" type="submit" disabled>Create account</button>
      <p class="form-foot">Already registered? <a href="signin.html">Sign in</a></p>
      <p id="registerSuccess" class="success-banner" hidden>Registration successful. You can now sign in.</p>
    </form>
  </main>
  <footer class="site-footer"><span>LibraDesk</span><span>Member registration</span></footer>
</body>
</html>
